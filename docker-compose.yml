services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casctf-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/casctf.db
      CHALLENGE_UPLOAD_DIR: /data/uploads/challenges
      CHALLENGE_INSTANCE_HOST: 144.24.72.17
      CHALLENGE_INSTANCE_PORT_MIN: 55000
      CHALLENGE_INSTANCE_PORT_MAX: 55025
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin1234
      JWT_SECRET_KEY: change-this-in-production
    volumes:
      - backend_data:/data
      - ./backend/docker:/app/docker
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: casctf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
    ports:
      - "3000:3000"

volumes:
  backend_data:
